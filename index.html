<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <title>Widget Clima</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <style>
    :root {
      /* Colores similares a tu widget de pomodoro */
      --bg-main: #050816;
      --bg-card: #0b1120;
      --accent:  #2563eb;
      --accent-soft: #1d4ed8;
      --text-main: #f9fafb;
      --text-secondary: #9ca3af;
      --danger: #f97316;
      --radius-lg: 18px;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI",
        sans-serif;
    }

    body {
      background: transparent; /* para Notion */
    }

    .weather-widget {
      background: var(--bg-main);
      color: var(--text-main);
      padding: 16px 20px;
      border-radius: var(--radius-lg);
      display: flex;
      align-items: center;
      gap: 32px;
      min-width: 780px;
      max-width: 900px;
      overflow: hidden;
    }

    .location-block {
      display: flex;
      flex-direction: column;
      gap: 4px;
      min-width: 140px;
      text-transform: uppercase;
      letter-spacing: 0.08em;
      font-size: 11px;
      color: var(--text-secondary);
    }

    .location-block .city {
      font-size: 13px;
      color: var(--text-main);
      font-weight: 600;
    }

    .current-weather {
      display: flex;
      align-items: center;
      gap: 14px;
      min-width: 130px;
    }

    .current-icon img {
      width: 38px;
      height: 38px;
      filter: drop-shadow(0 0 6px rgba(37, 99, 235, 0.5));
    }

    .current-data {
      display: flex;
      flex-direction: column;
      gap: 2px;
    }

    .current-temp {
      font-size: 24px;
      font-weight: 600;
    }

    .current-desc {
      font-size: 11px;
      color: var(--text-secondary);
      text-transform: lowercase;
    }

    .forecast-strip {
      display: flex;
      gap: 16px;
      flex: 1;
      justify-content: space-between;
    }

    .day-card {
      background: var(--bg-card);
      border-radius: var(--radius-lg);
      padding: 8px 10px;
      min-width: 80px;
      text-align: center;
      display: flex;
      flex-direction: column;
      gap: 4px;
      box-shadow: 0 4px 10px rgba(0, 0, 0, 0.35);
    }

    .day-name {
      font-size: 11px;
      font-weight: 600;
      color: var(--text-secondary);
    }

    .day-icon img {
      width: 26px;
      height: 26px;
    }

    .day-temps {
      font-size: 11px;
      color: var(--text-secondary);
      display: flex;
      flex-direction: column;
      gap: 2px;
    }

    .temp-max {
      color: var(--accent);
      font-weight: 600;
    }

    .temp-min {
      opacity: 0.85;
    }

    .status-bar {
      position: absolute;
      inset: auto 20px 10px 20px;
      display: flex;
      justify-content: space-between;
      font-size: 10px;
      color: var(--text-secondary);
      pointer-events: none;
    }

    .status-bar span {
      pointer-events: auto;
    }

    .weather-wrapper {
      position: relative;
      width: 100%;
    }

    .badge {
      background: rgba(37, 99, 235, 0.16);
      color: var(--accent);
      border-radius: 999px;
      padding: 2px 10px;
      font-size: 10px;
      text-transform: uppercase;
      letter-spacing: 0.08em;
      font-weight: 600;
    }

    /* Mensajes de error / carga */
    .message {
      font-size: 11px;
      color: var(--danger);
      margin-top: 4px;
    }
  </style>
</head>
<body>
  <div class="weather-wrapper">
    <div class="weather-widget" id="weather-widget">
      <div class="location-block">
        <span class="city" id="city-name">Detectando ubicación…</span>
        <span>CLIMA</span>
        <span class="badge" id="badge-text">Cargando datos</span>
        <span class="message" id="error-text"></span>
      </div>

      <div class="current-weather">
        <div class="current-icon" id="current-icon"></div>
        <div class="current-data">
          <div class="current-temp" id="current-temp">-- ºC</div>
          <div class="current-desc" id="current-desc">--</div>
        </div>
      </div>

      <div class="forecast-strip" id="forecast-strip">
        <!-- Los días se llenan por JS -->
      </div>
    </div>

    <div class="status-bar">
      <span id="updated-at">Actualizado: --</span>
      <span>Fuente: OpenWeather • Ubicación por GPS</span>
    </div>
  </div>

  <script>
    // =============== CONFIGURACIÓN ===============
    const API_KEY = "ada1e08f2bb58ca3ddf5178acd4ccf04
"; // <--- reemplaza esto
    const UNITS = "metric";
    const LANG = "es";

    // Días en español empezando en lunes
    const DAYS_ORDERED = ["Lunes", "Martes", "Miércoles", "Jueves", "Viernes", "Sábado", "Domingo"];

    const cityNameEl = document.getElementById("city-name");
    const badgeTextEl = document.getElementById("badge-text");
    const errorTextEl = document.getElementById("error-text");
    const currentIconEl = document.getElementById("current-icon");
    const currentTempEl = document.getElementById("current-temp");
    const currentDescEl = document.getElementById("current-desc");
    const forecastStripEl = document.getElementById("forecast-strip");
    const updatedAtEl = document.getElementById("updated-at");

    // =============== GEOLOCALIZACIÓN ===============
    function initWeather() {
      if (!navigator.geolocation) {
        showError("Tu navegador no permite obtener la ubicación.");
        return;
      }

      navigator.geolocation.getCurrentPosition(
        (pos) => {
          const { latitude, longitude } = pos.coords;
          fetchWeather(latitude, longitude);
        },
        (err) => {
          console.error(err);
          showError("No se pudo obtener la ubicación. Revisa los permisos de GPS.");
          badgeTextEl.textContent = "Sin ubicación";
        },
        {
          enableHighAccuracy: true,
          timeout: 15000,
          maximumAge: 5 * 60 * 1000
        }
      );
    }

    // =============== PETICIÓN A OPENWEATHER ===============
    async function fetchWeather(lat, lon) {
      try {
        badgeTextEl.textContent = "Actualizando…";

        const urlOneCall = `https://api.openweathermap.org/data/2.5/onecall?lat=${lat}&lon=${lon}&exclude=minutely,hourly,alerts&units=${UNITS}&lang=${LANG}&appid=${API_KEY}`;
        const urlGeo = `https://api.openweathermap.org/geo/1.0/reverse?lat=${lat}&lon=${lon}&limit=1&appid=${API_KEY}`;

        const [weatherRes, geoRes] = await Promise.all([
          fetch(urlOneCall),
          fetch(urlGeo)
        ]);

        if (!weatherRes.ok) throw new Error("Error al obtener el clima");
        if (!geoRes.ok) throw new Error("Error al obtener el nombre de la ciudad");

        const weatherData = await weatherRes.json();
        const geoData = await geoRes.json();

        const city = (geoData[0]?.local_names?.es || geoData[0]?.name || "Tu ubicación").toUpperCase();
        renderWeather(city, weatherData);
        badgeTextEl.textContent = "Ubicación activada";
      } catch (e) {
        console.error(e);
        showError("No se pudo cargar el clima. Verifica tu API key o conexión.");
        badgeTextEl.textContent = "Error";
      }
    }

    // =============== RENDER ===============
    function renderWeather(city, data) {
      cityNameEl.textContent = city;

      // Actual
      const { temp, weather } = data.current;
      const iconCode = weather[0].icon;
      const desc = weather[0].description;

      currentTempEl.textContent = `${Math.round(temp)} ºC`;
      currentDescEl.textContent = desc;
      currentIconEl.innerHTML = `<img src="https://openweathermap.org/img/wn/${iconCode}@2x.png" alt="${desc}">`;

      // Forecast 7 días
      const daily = data.daily.slice(0, 7); // incluye hoy

      // Mapeamos cada día a su nombre y orden lunes-domingo
      const cards = daily.map((dayData) => {
        const date = new Date(dayData.dt * 1000);
        const jsDay = date.getDay(); // 0=Domingo…6=Sábado
        const dayName = mapDayToSpanish(jsDay);
        const min = Math.round(dayData.temp.night);
        const max = Math.round(dayData.temp.day);
        const icon = dayData.weather[0].icon;

        return {
          name: dayName,
          min,
          max,
          icon,
          dt: date
        };
      });

      // Ordenar de lunes a domingo según DAYS_ORDERED
      cards.sort((a, b) => {
        return DAYS_ORDERED.indexOf(a.name) - DAYS_ORDERED.indexOf(b.name);
      });

      // Pintar
      forecastStripEl.innerHTML = "";
      cards.forEach((c) => {
        const card = document.createElement("div");
        card.className = "day-card";
        card.innerHTML = `
          <div class="day-name">${c.name}</div>
          <div class="day-icon">
            <img src="https://openweathermap.org/img/wn/${c.icon}.png" alt="">
          </div>
          <div class="day-temps">
            <span class="temp-max">${c.max} ºC</span>
            <span class="temp-min">${c.min} ºC</span>
          </div>
        `;
        forecastStripEl.appendChild(card);
      });

      const now = new Date();
      updatedAtEl.textContent = `Actualizado: ${now.toLocaleTimeString("es-PE", {
        hour: "2-digit",
        minute: "2-digit"
      })}`;
    }

    function mapDayToSpanish(jsDay) {
      // jsDay: 0 = Domingo ... 6 = Sábado
      const map = {
        0: "Domingo",
        1: "Lunes",
        2: "Martes",
        3: "Miércoles",
        4: "Jueves",
        5: "Viernes",
        6: "Sábado"
      };
      return map[jsDay];
    }

    function showError(msg) {
      errorTextEl.textContent = msg;
    }

    // Iniciar
    initWeather();
  </script>
</body>
</html>
