<script>
  // =============== CONFIGURACIÓN ===============
  // He puesto directamente tu API key aquí:
  const API_KEY = "ada1e08f2bb58ca3ddf5178acd4ccf04";
  const UNITS = "metric";
  const LANG = "es";

  // Días en español empezando en lunes
  const DAYS_ORDERED = ["Lunes", "Martes", "Miércoles", "Jueves", "Viernes", "Sábado", "Domingo"];

  const cityNameEl = document.getElementById("city-name");
  const badgeTextEl = document.getElementById("badge-text");
  const errorTextEl = document.getElementById("error-text");
  const currentIconEl = document.getElementById("current-icon");
  const currentTempEl = document.getElementById("current-temp");
  const currentDescEl = document.getElementById("current-desc");
  const forecastStripEl = document.getElementById("forecast-strip");
  const updatedAtEl = document.getElementById("updated-at");

  // =============== GEOLOCALIZACIÓN ===============
  function initWeather() {
    if (!navigator.geolocation) {
      showError("Tu navegador no permite obtener la ubicación. Usando Lima por defecto.");
      badgeTextEl.textContent = "Sin GPS";
      // Lima centro aprox.
      fetchWeather(-12.0464, -77.0428, "LIMA (por defecto)");
      return;
    }

    badgeTextEl.textContent = "Solicitando GPS…";

    navigator.geolocation.getCurrentPosition(
      (pos) => {
        const { latitude, longitude } = pos.coords;
        fetchWeather(latitude, longitude);
      },
      (err) => {
        console.error("Error geolocalización:", err);
        showError("No se pudo obtener la ubicación. Usando Lima por defecto. Revisa los permisos de GPS.");
        badgeTextEl.textContent = "Sin GPS";
        // Fallback a Lima
        fetchWeather(-12.0464, -77.0428, "LIMA (por defecto)");
      },
      {
        enableHighAccuracy: true,
        timeout: 10000,
        maximumAge: 5 * 60 * 1000
      }
    );
  }

  // =============== PETICIÓN A OPENWEATHER (weather + forecast) ===============
  async function fetchWeather(lat, lon, forcedCityName = null) {
    try {
      badgeTextEl.textContent = "Cargando datos…";
      errorTextEl.textContent = "";

      const urlCurrent = `https://api.openweathermap.org/data/2.5/weather?lat=${lat}&lon=${lon}&units=${UNITS}&lang=${LANG}&appid=${API_KEY}`;
      const urlForecast = `https://api.openweathermap.org/data/2.5/forecast?lat=${lat}&lon=${lon}&units=${UNITS}&lang=${LANG}&appid=${API_KEY}`;

      const [currentRes, forecastRes] = await Promise.all([
        fetch(urlCurrent),
        fetch(urlForecast)
      ]);

      if (!currentRes.ok) {
        const txt = await currentRes.text();
        console.error("Error API weather:", currentRes.status, txt);
        throw new Error("Error al obtener el clima actual. Código: " + currentRes.status);
      }
      if (!forecastRes.ok) {
        const txt = await forecastRes.text();
        console.error("Error API forecast:", forecastRes.status, txt);
        throw new Error("Error al obtener el pronóstico. Código: " + forecastRes.status);
      }

      const currentData = await currentRes.json();
      const forecastData = await forecastRes.json();

      const city =
        forcedCityName ||
        currentData.name ||
        "Tu ubicación";

      renderWeather(city.toUpperCase(), currentData, forecastData);
      badgeTextEl.textContent = "Ubicación activada";
    } catch (e) {
      console.error(e);
      showError("No se pudo cargar el clima. Verifica tu conexión o que la API key siga activa.");
      badgeTextEl.textContent = "Error";
    }
  }

  // =============== RENDER ===============
  function renderWeather(city, currentData, forecastData) {
    cityNameEl.textContent = city;

    // ---- Actual ----
    const temp = currentData.main.temp;
    const desc = currentData.weather[0].description;
    const iconCode = currentData.weather[0].icon;

    currentTempEl.textContent = `${Math.round(temp)} ºC`;
    currentDescEl.textContent = desc;
    currentIconEl.innerHTML = `<img src="https://openweathermap.org/img/wn/${iconCode}@2x.png" alt="${desc}">`;

    // ---- Pronóstico diario (a partir de /forecast cada 3 horas) ----
    const list = forecastData.list || [];
    const daysMap = new Map(); // clave: 'YYYY-MM-DD' -> {min, max, icon, dt}

    list.forEach((item) => {
      const d = new Date(item.dt * 1000);
      const dateKey = d.getFullYear() + "-" + String(d.getMonth() + 1).padStart(2, "0") + "-" + String(d.getDate()).padStart(2, "0");

      const tempMin = item.main.temp_min;
      const tempMax = item.main.temp_max;
      const icon = item.weather[0].icon;

      if (!daysMap.has(dateKey)) {
        daysMap.set(dateKey, {
          min: tempMin,
          max: tempMax,
          icon: icon,
          dt: d
        });
      } else {
        const dayData = daysMap.get(dateKey);
        dayData.min = Math.min(dayData.min, tempMin);
        dayData.max = Math.max(dayData.max, tempMax);
        // dejamos el icono del primer registro (suficiente para un widget)
      }
    });

    // Convertimos a array y ordenamos por fecha
    const daysArray = Array.from(daysMap.values()).sort((a, b) => a.dt - b.dt);
    // Tomamos máximo 7 días
    const daysLimited = daysArray.slice(0, 7);

    // Mapeamos a nombre de día
    const cards = daysLimited.map((dData) => {
      const dayName = mapDayToSpanish(dData.dt.getDay());
      return {
        name: dayName,
        min: Math.round(dData.min),
        max: Math.round(dData.max),
        icon: dData.icon,
        dt: dData.dt
      };
    });

    // Ordenar visualmente de lunes a domingo
    cards.sort((a, b) => {
      return DAYS_ORDERED.indexOf(a.name) - DAYS_ORDERED.indexOf(b.name);
    });

    // Pintar
    forecastStripEl.innerHTML = "";
    cards.forEach((c) => {
      const card = document.createElement("div");
      card.className = "day-card";
      card.innerHTML = `
        <div class="day-name">${c.name}</div>
        <div class="day-icon">
          <img src="https://openweathermap.org/img/wn/${c.icon}.png" alt="">
        </div>
        <div class="day-temps">
          <span class="temp-max">${c.max} ºC</span>
          <span class="temp-min">${c.min} ºC</span>
        </div>
      `;
      forecastStripEl.appendChild(card);
    });

    const now = new Date();
    updatedAtEl.textContent = `Actualizado: ${now.toLocaleTimeString("es-PE", {
      hour: "2-digit",
      minute: "2-digit"
    })}`;
  }

  function mapDayToSpanish(jsDay) {
    const map = {
      0: "Domingo",
      1: "Lunes",
      2: "Martes",
      3: "Miércoles",
      4: "Jueves",
      5: "Viernes",
      6: "Sábado"
    };
    return map[jsDay];
  }

  function showError(msg) {
    errorTextEl.textContent = msg;
  }

  // Iniciar
  initWeather();
</script>
