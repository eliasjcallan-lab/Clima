<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <title>Widget Clima</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <style>
    :root {
      --text-main: #f9fafb;
      --text-secondary: #9ca3af;
      --danger: #f97316;
      --radius-lg: 18px;
      --accent: #2563eb;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }

    html, body {
      background: transparent; /* importantísimo para Notion */
    }

    .weather-widget {
      background: radial-gradient(
        circle at 50% 40%,
        #2563eb 0%,
        #1e3a8a 45%,
        #0a0f1f 100%
      );
      background-repeat: no-repeat;
      background-size: 140% 140%;
      color: var(--text-main);
      padding: 31px 24px 39px 24px;
      border-radius: var(--radius-lg);
      display: inline-flex;
      align-items: center;
      gap: 10px;
      width: auto;
      max-width: none;
    }

    .location-block {
      display: flex;
      flex-direction: column;
      gap: 6px;
      min-width: 180px;
      font-size: 11px;
      color: var(--text-secondary);
    }

    .city {
      font-size: 14px;
      font-weight: 600;
      color: var(--text-main);
      letter-spacing: 0.02em;
      text-transform: none;
    }

    .badge {
      background: rgba(37, 99, 235, 0.8);
      color: #ffffff;
      border-radius: 999px;
      padding: 4px 18px;
      font-size: 13px;
      font-weight: 700;
      text-transform: none;
      letter-spacing: 0.05em;
      width: fit-content;
    }

    .status-text {
      font-size: 10px;
      color: var(--text-secondary);
    }

    .message {
      color: var(--danger);
      font-size: 11px;
    }

    .current-weather {
      display: flex;
      align-items: center;
      gap: 14px;
      min-width: 120px;
      margin-left: -5px; /* lo desplazamos un poco a la izquierda */
    }

    .current-icon img {
      width: 48px;
      height: 48px;
    }

    .current-temp {
      font-size: 26px;
      font-weight: bold;
    }

    .current-desc {
      color: var(--text-secondary);
      font-size: 11px;
      text-transform: lowercase;
    }

    .forecast-strip {
      display: flex;
      gap: 10px;
      justify-content: flex-end;
      flex-wrap: nowrap;
      flex: 0 0 auto;
      overflow: visible;
    }

    .day-card {
      background: rgba(15, 23, 42, 0.96);
      border-radius: var(--radius-lg);
      padding: 16px 12px 18px 12px;
      min-width: 62px;
      max-width: 72px;
      flex: 0 0 auto;
      text-align: center;
      display: flex;
      flex-direction: column;
      gap: 6px;
    }

    .day-card.today {
      outline: 2px solid var(--accent);
    }

    .day-name {
      font-size: 11px;
      color: var(--text-secondary);
      font-weight: 600;
    }

    .hoy {
      font-size: 9px;
      color: var(--accent);
      margin-top: 1px;
      text-transform: uppercase;
    }

    .day-icon img {
      width: 26px;
      height: 26px;
    }

    .day-temps {
      font-size: 11px;
      color: var(--text-secondary);
    }

    .temp-max {
      color: #ffffff;
      font-weight: bold;
    }

    .temp-min {
      color: #ffffff;
      opacity: 0.85;
    }
  </style>
</head>
<body>
  <div class="weather-wrapper">
    <div class="weather-widget">

      <div class="location-block">
        <!-- Solo distrito -->
        <span class="city" id="city-name">Detectando ubicación…</span>

        <!-- Pastilla azul: departamento -->
        <span class="badge" id="badge-text">Departamento</span>

        <!-- Actualizado dentro del cuadro -->
        <span class="status-text" id="updated-at">Actualizado: --</span>

        <span class="message" id="error-text"></span>
      </div>

      <div class="current-weather">
        <div class="current-icon" id="current-icon"></div>
        <div class="current-data">
          <div class="current-temp" id="current-temp">-- ºC</div>
          <div class="current-desc" id="current-desc">--</div>
        </div>
      </div>

      <div class="forecast-strip" id="forecast-strip"></div>
    </div>
  </div>

<script>
const API_KEY = "ada1e08f2bb58ca3ddf5178acd4ccf04";
const UNITS = "metric";
const LANG = "es";

const DAYS = ["Domingo","Lunes","Martes","Miércoles","Jueves","Viernes","Sábado"];
const ORDER = ["Lunes","Martes","Miércoles","Jueves","Viernes","Sábado","Domingo"];

const cityNameEl = document.getElementById("city-name");
const badgeTextEl = document.getElementById("badge-text");
const errorTextEl = document.getElementById("error-text");
const currentIconEl = document.getElementById("current-icon");
const currentTempEl = document.getElementById("current-temp");
const currentDescEl = document.getElementById("current-desc");
const forecastStripEl = document.getElementById("forecast-strip");
const updatedAtEl = document.getElementById("updated-at");

function initWeather(){
  if(!navigator.geolocation){
    // Si el navegador no soporta GPS, intentamos por IP
    fetchLocationByIP();
    return;
  }

  navigator.geolocation.getCurrentPosition(
    (pos)=>fetchWeather(pos.coords.latitude,pos.coords.longitude),
    (err)=>{
      console.warn("Error geolocalización, uso IP:", err);
      // Si falla GPS (caso típico en Notion), usamos IP
      fetchLocationByIP();
    },
    {enableHighAccuracy:true,timeout:8000}
  );
}

async function fetchLocationByIP(){
  try{
    const resp = await fetch("https://ipapi.co/json/");
    const data = await resp.json();
    if(data && data.latitude && data.longitude){
      fetchWeather(data.latitude, data.longitude);
    } else {
      // Fallback duro si IP falla
      fetchWeather(-12.0464,-77.0428);
    }
  } catch(e){
    console.error("Error geoloc por IP:", e);
    fetchWeather(-12.0464,-77.0428);
  }
}

function loadFallback(){
  fetchWeather(-12.0464,-77.0428);
}

async function fetchWeather(lat,lon){
  try{
    const urlW = `https://api.openweathermap.org/data/2.5/weather?lat=${lat}&lon=${lon}&units=${UNITS}&lang=${LANG}&appid=${API_KEY}`;
    const urlF = `https://api.openweathermap.org/data/2.5/forecast?lat=${lat}&lon=${lon}&units=${UNITS}&lang=${LANG}&appid=${API_KEY}`;
    const urlOSM = `https://nominatim.openstreetmap.org/reverse?lat=${lat}&lon=${lon}&format=json&accept-language=es&addressdetails=1`;

    const [wRes,fRes,osmRes] = await Promise.all([
      fetch(urlW),fetch(urlF),fetch(urlOSM)
    ]);

    const weather = await wRes.json();
    const forecast = await fRes.json();
    const osm = await osmRes.json();

    const loc = parseLocation(osm,weather);

    renderWeather(loc,weather,forecast);
  }catch(e){
    console.error(e);
    errorTextEl.textContent="Error cargando clima";
  }
}

// Ciudad = distrito, pastilla = departamento
function parseLocation(osm,weather){
  const a = osm.address || {};

  const dep =
    a.state || a.region || a.county || "Lima";

  const dist =
    a.city_district || a.suburb || a.town || a.city || weather.name || dep;

  return { dep, dist };
}

function renderWeather(loc,w,f){
  cityNameEl.textContent = loc.dist;  // distrito
  badgeTextEl.textContent = loc.dep;  // departamento

  currentTempEl.textContent = `${Math.round(w.main.temp)} ºC`;
  currentDescEl.textContent = w.weather[0].description;
  currentIconEl.innerHTML = `<img src="https://openweathermap.org/img/wn/${w.weather[0].icon}@2x.png">`;

  // === Pronóstico agrupado por día ===
  const grouped = {};
  f.list.forEach(i=>{
    const d = new Date(i.dt*1000);
    const key = d.toDateString();
    if(!grouped[key]){
      grouped[key] = {
        min: i.main.temp_min,
        max: i.main.temp_max,
        icon: i.weather[0].icon,
        day: DAYS[d.getDay()],
        date: d
      };
    } else {
      grouped[key].min = Math.min(grouped[key].min, i.main.temp_min);
      grouped[key].max = Math.max(grouped[key].max, i.main.temp_max);
    }
  });

  let list = Object.values(grouped).sort((a,b)=>a.date - b.date);

  while(list.length < 7 && list.length > 0){
    const last = list[list.length - 1];
    const nextDate = new Date(last.date.getTime());
    nextDate.setDate(nextDate.getDate() + 1);
    list.push({
      min: last.min,
      max: last.max,
      icon: last.icon,
      day: DAYS[nextDate.getDay()],
      date: nextDate
    });
  }

  list.sort((a,b)=>ORDER.indexOf(a.day) - ORDER.indexOf(b.day));

  const todayName = DAYS[new Date().getDay()];

  forecastStripEl.innerHTML="";
  list.slice(0,7).forEach(d=>{
    const div=document.createElement("div");
    div.className="day-card";
    if(d.day===todayName) div.classList.add("today");

    div.innerHTML=`
      <div class="day-name">
        ${d.day}${d.day===todayName?'<div class="hoy">HOY</div>':''}
      </div>
      <div class="day-icon"><img src="https://openweathermap.org/img/wn/${d.icon}.png"></div>
      <div class="day-temps">
        <div class="temp-max">${Math.round(d.max)} ºC</div>
        <div class="temp-min">${Math.round(d.min)} ºC</div>
      </div>
    `;
    forecastStripEl.appendChild(div);
  });

  updatedAtEl.textContent = "Actualizado: " +
    new Date().toLocaleTimeString("es-PE",{hour:"2-digit",minute:"2-digit"});
}

initWeather();
</script>

</body>
</html>
